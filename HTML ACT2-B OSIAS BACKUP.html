<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project in HTML
    </title>
</head>
<body>
  
    <h1> REGISTRATION FORM</h1>
    
  <form autocomplete="on">
     <label> UserID: </label>
     <input type="text" name="userid" autofocus> 
     <br><br>

     
     <label> Password: </label> 
     <input type="password" name="pword" required>
     <br><br> 

     
     <label> Name: </label>
     <input type="text" name="name"required> 
     <br><br>

     <label> Address: </label>
     <input type="text" name="address"required>
     <br><br>
    
     Country:<select><option>Please select a Country</option>
     <option>Phillipines</option>
     <option>    USA     </option>
     <option> Indonesia  </option>
     <option>   Japan    </option>
     <option> Australia  </option>
     </select>

     <label>ZIPCODE:</label>
     <input type="text" name="zipcode" >
     <br><br>

     <label>EMAIL:</label>
     <input type="email" name="email" required>
     <br><br> 

     <label>Gender:</label>
     <input type ="radio" name="gender" value="male" checked > Male 
     <input type ="radio" name="gender" value="female" > Female 
     <br><br>
    

     <label>Language:</label>
     <input type ="checkbox" name="language" value="English" checked> English 
     <input type ="checkbox" name="language" value="Non English" > Non English 
     <br><br>
    
     <label> About: </label>
     <br>
     <textarea name="about" rows="8" cols="55"> </textarea>
     <br><br>

     <input type="Submit" value="Submit">
     <br>
  </form>
</body>
</html>
